<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar música</title>
    <link rel="stylesheet" href="editar.css">
</head>
<body>

    <main class="container">
        <a href="index.html" class="voltar">
            Voltar para a lista
        </a>

        <h1>Editar música</h1>

        <section class="card">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" placeholder="Nome da música">

            <label for="artista">Artista</label>
            <input type="text" id="artista" placeholder="Nome do artista">

            <label for="genero">Gênero</label>
            <input type="text" id="genero" placeholder="Gênero musical">

            <label for="ano">Ano</label>
            <input type="number" id="ano" placeholder="Ano de lançamento">

            <label for="duracao">Duração em minutos</label>
            <input type="number" id="duracao" placeholder="Duração da música">

            <button id="botaoSalvar">Salvar alterações</button>
        </section>
    </main>

    <script src="editar.js"></script>
</body>
</html>
